<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agoryx</title>
<link rel="stylesheet" href="start.css">
<script src="start.js" defer></script>
</head>
<body>
<main class="start">
  <header class="head">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="3.2"/><circle cx="5.5" cy="17" r="3.2"/><circle cx="18.5" cy="17" r="3.2"/></svg>
    <div class="head-text" aria-live="polite">
      <h1 id="title">Відкриваю Agoryx</h1>
      <p id="note" class="note" hidden></p>
    </div>
  </header>

  <ol id="steps" class="steps" aria-label="Хід запуску"></ol>

  <section id="problem" class="problem" hidden>
    <p id="problem-message" class="problem-message"></p>
    <pre id="problem-log" class="problem-log" hidden></pre>
    <p id="problem-path" class="problem-path" hidden></p>
  </section>

  <ul id="checks" class="checks" aria-label="Перевірки" hidden></ul>

  <div id="actions" class="actions"></div>
</main>
</body>
</html>
