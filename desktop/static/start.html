<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agoryx</title>
<link rel="stylesheet" href="start.css">
<script src="start.js" defer></script>
</head>
<body>
<main class="start">
  <header class="head">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 2.5 H6.525 L10.525 6.5 H7 V17.5 H11 L15 21.5 H2.5 Z"/><path d="M21.5 21.5 H17.475 L13.475 17.5 H17 V6.5 H13 L9 2.5 H21.5 Z"/></svg>
    <div class="head-text" aria-live="polite">
      <h1 id="title">Opening Agoryx</h1>
      <p id="note" class="note" hidden></p>
    </div>
  </header>

  <ol id="steps" class="steps" aria-label="Startup progress"></ol>

  <section id="problem" class="problem" hidden>
    <p id="problem-message" class="problem-message"></p>
    <pre id="problem-log" class="problem-log" hidden></pre>
    <p id="problem-path" class="problem-path" hidden></p>
  </section>

  <ul id="checks" class="checks" aria-label="Checks" hidden></ul>

  <div id="actions" class="actions"></div>
</main>
</body>
</html>
